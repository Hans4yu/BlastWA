<div class="page-header">
  <div>
    <h1 class="page-title">Auto Reply</h1>
    <p class="page-subtitle">Keyword-based auto responder rules</p>
  </div>
  <div class="row">
    <button class="btn btn-secondary" id="btn-add-rule">+ Add Rule</button>
    <button class="btn" id="btn-save-rules">Save Rules</button>
  </div>
</div>

<div class="panel">
  <div class="panel-body" style="padding-top:10px;padding-bottom:10px">
    <p class="panel-note" style="margin:0" id="watch-status">Checking watcher&hellip;</p>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <span>Rules</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:60px">Enabled</th>
            <th style="width:160px">Name</th>
            <th style="width:130px">Match Type</th>
            <th style="width:180px">Keyword</th>
            <th>Reply Message</th>
            <th style="width:80px"></th>
          </tr>
        </thead>
        <tbody id="rules-body"></tbody>
      </table>
      <div class="empty-state" id="rules-empty">No rules yet. Add one to start auto-replying.</div>
    </div>
    <div class="counts-bar">
      <span>Rules: <b id="rules-count">0</b></span>
      <span id="rules-status" style="font-size:11px;color:var(--text-dim)"></span>
    </div>
  </div>
</div>

<script>
  window.init_autoreply = async function () {
    const { invoke, addCleanup, esc } = window.blastwa;
    const $ = (id) => document.getElementById(id);

    function addRuleRow() {
      $('rules-empty').style.display = 'none';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="checkbox" class="r-enabled" checked /></td>
        <td><input type="text" class="r-name" placeholder="Rule name" /></td>
        <td>
          <select class="r-match">
            <option value="contains">Contains</option>
            <option value="like">Like (exact)</option>
            <option value="start_with">Start With</option>
            <option value="end_with">End With</option>
          </select>
        </td>
        <td><input type="text" class="r-keyword" placeholder="promo" /></td>
        <td><input type="text" class="r-reply" placeholder="Thanks for your interest!" /></td>
        <td><button class="btn btn-sm btn-danger">Delete</button></td>`;
      $('rules-body').appendChild(tr);
      syncEmpty();
    }

    function syncEmpty() {
      $('rules-empty').style.display =
        $('rules-body').children.length ? 'none' : '';
      syncCount();
    }

    function syncCount() {
      $('rules-count').textContent = $('rules-body').children.length;
    }

    // a row only counts as a rule once keyword AND reply exist; anything
    // else is an in-progress row and is skipped at save time (the rust side
    // applies the same filter — an empty keyword would match every message)
    function collectRules() {
      return Array.from($('rules-body').children).map((tr) => ({
        name: tr.querySelector('.r-name').value.trim(),
        match_type: matchTypeToBackend(tr.querySelector('.r-match').value),
        keyword: tr.querySelector('.r-keyword').value.trim(),
        reply_message: tr.querySelector('.r-reply').value,
        enabled: tr.querySelector('.r-enabled').checked,
      })).filter((r) => r.keyword && r.reply_message.trim());
    }

    // the rust enum is a plain externally-tagged unit variant, so the wire
    // form is PascalCase, not the snake_case used by the select values
    function matchTypeToBackend(v) {
      return ({
        contains: 'Contains', like: 'Like',
        start_with: 'StartWith', end_with: 'EndWith',
      })[v] || 'Contains';
    }
    function matchTypeToUi(v) {
      return ({
        Contains: 'contains', Like: 'like',
        StartWith: 'start_with', EndWith: 'end_with',
      })[v] || 'contains';
    }

    function setStatus(msg) {
      $('rules-status').textContent = msg || '';
    }

    // ----- autosave: rules survive tab switches without pressing Save -----
    // route() rebuilds this page on every navigation, which used to wipe
    // unsaved rows. every edit now schedules a debounced save, and the
    // router cleanup fires one last save when the user leaves the tab.
    let dirty = false;
    let saveTimer = null;

    function markDirty() {
      dirty = true;
      setStatus('Unsaved changes \u2014 saving automatically\u2026');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveRules(true), 800);
    }

    async function saveRules(silent) {
      clearTimeout(saveTimer);
      saveTimer = null;
      const rules = collectRules();
      const skipped = $('rules-body').children.length - rules.length;
      const btn = $('btn-save-rules');
      if (!silent) {
        btn.disabled = true;
        btn.textContent = 'Saving...';
      }
      try {
        const res = await invoke('save_rules', { rules });
        dirty = false;
        const n = (res && res.saved !== undefined) ? res.saved : rules.length;
        if (!silent) {
          setStatus(`saved ${n} rule${n === 1 ? '' : 's'}` +
            (skipped ? ` \u00b7 ${skipped} row(s) skipped: keyword + reply required` : ''));
        } else {
          setStatus(`All changes saved${skipped ? ` \u00b7 ${skipped} row(s) incomplete` : ''}`);
        }
      } catch (e) {
        const msg = 'Save failed: ' + (e && e.message ? e.message : e);
        if (!silent) {
          setStatus('');
          alert(msg);
        } else {
          setStatus(msg + ' \u2014 retrying on next change');
        }
      } finally {
        if (!silent) {
          btn.disabled = false;
          btn.textContent = 'Save Rules';
        }
      }
    }

    addCleanup(() => {
      clearTimeout(saveTimer);
      if (!dirty) return;
      // fire-and-forget: the webview outlives the navigation, so the ipc
      // still lands in rust even though this page's dom is gone
      invoke('save_rules', { rules: collectRules() }).catch(() => {});
    });

    $('btn-add-rule').addEventListener('click', () => {
      addRuleRow();
      markDirty();
    });
    $('btn-save-rules').addEventListener('click', () => saveRules(false));

    // row edits + deletes are handled by delegation so rows added later are
    // covered without re-binding
    $('rules-body').addEventListener('input', (ev) => {
      if (ev.target.closest('tr')) markDirty();
    });
    $('rules-body').addEventListener('change', (ev) => {
      if (ev.target.closest('tr')) markDirty();
    });
    $('rules-body').addEventListener('click', (ev) => {
      const del = ev.target.closest('button.btn-danger');
      if (!del) return;
      del.closest('tr').remove();
      syncEmpty();
      markDirty();
    });

    // ----- watcher status strip (live telemetry from the rust watcher) -----
    async function refreshWatcher() {
      const el = $('watch-status');
      if (!el) return;
      try {
        const st = await invoke('autoreply_status');
        const watching = Array.isArray(st.watching) ? st.watching : [];
        const parts = [];
        let lead;
        if (st.armed_rules > 0 && watching.length) {
          lead = '<b>Auto-reply is on.</b>';
          parts.push(`watching: ${esc(watching.join(', '))}`);
        } else if (st.armed_rules > 0) {
          lead = '<b>Rules armed.</b> Open an account from the Dashboard to start watching.';
        } else if (st.total_rules > 0) {
          lead = 'No armed rules \u2014 a rule needs a keyword, a reply and the Enabled tick to fire.';
        } else {
          lead = 'Incoming messages are watched on every running account session. Add a rule to start auto-replying.';
        }
        if (st.armed_rules > 0) parts.push(`${st.armed_rules} armed rule${st.armed_rules === 1 ? '' : 's'}`);
        if (st.replies_sent > 0) {
          const when = st.last_reply_epoch
            ? ` (last ${new Date(st.last_reply_epoch * 1000).toLocaleTimeString()})` : '';
          parts.push(`${st.replies_sent} auto-repl${st.replies_sent === 1 ? 'y' : 'ies'} sent${when}`);
        }
        el.innerHTML = `${lead} ${parts.length ? '&middot; ' + esc(parts.join(' \u00b7 ')) : ''}`;
      } catch (e) {
        el.textContent = 'Watcher status unavailable: ' + (e && e.message ? e.message : e);
      }
    }
    const watchTimer = setInterval(refreshWatcher, 5000);
    addCleanup(() => clearInterval(watchTimer));

    const res = await invoke('load_rules');
    const rules = Array.isArray(res) ? res : [];
    rules.forEach((r) => {
      addRuleRow();
      const last = $('rules-body').lastElementChild;
      last.querySelector('.r-enabled').checked = r.enabled ?? true;
      last.querySelector('.r-name').value = r.name || '';
      last.querySelector('.r-match').value = matchTypeToUi(r.match_type);
      last.querySelector('.r-keyword').value = r.keyword || '';
      last.querySelector('.r-reply').value = r.reply_message || '';
    });
    // restored rows start clean: no phantom "unsaved" flag from the load itself
    dirty = false;
    setStatus('');
    refreshWatcher();
  };
</script>
