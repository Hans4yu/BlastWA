<div class="page-header">
  <div>
    <h1 class="page-title">Templates</h1>
    <p class="page-subtitle">Reusable message templates with tags</p>
  </div>
  <div class="row">
    <input type="text" id="tpl-search" placeholder="Search name or tag..." style="width:240px" />
    <button class="btn" onclick="openNewTpl()">+ New Template</button>
  </div>
</div>

<div class="panel" id="tpl-editor" style="display:none">
  <div class="panel-header">
    <span id="tpl-editor-title">New Template</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body">
    <div class="field"><label>Name</label><input type="text" id="tpl-name" /></div>
    <div class="field"><label>Tags (comma separated)</label><input type="text" id="tpl-tags" placeholder="promo,sales" /></div>
    <div class="field"><label>Body (supports spintax &amp; variables</label><textarea id="tpl-body"></textarea></div>
    <div class="row" style="margin-bottom:0">
      <button class="btn" onclick="saveTpl()">Save</button>
      <button class="btn btn-secondary" onclick="closeEditor()">Cancel</button>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <span>Template List</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Tags</th><th>Body Preview</th><th style="width:230px">Actions</th>
          </tr>
        </thead>
        <tbody id="tpl-body-rows"></tbody>
      </table>
      <div class="empty-state" id="tpl-empty">No templates found.</div>
    </div>
    <div class="counts-bar">
      <span>Total: <b id="tpl-count">0</b></span>
    </div>
  </div>
</div>

<script>
  // id of the template being edited, null for a new one. var, not let:
  // scripts re-execute per navigation and a top-level lexical binding would
  // throw 'already declared' on the second visit to this tab
  var editingId = null;

  window.init_templates = async function () {
    const { invoke } = window.blastwa;
    document.getElementById('tpl-search').addEventListener('input', refresh);
    await refresh();
  };

  // "load to composer" is a frontend concern: the sending page restores its
  // state from this same localStorage draft on init, so writing the draft is
  // all it takes. there is no rust command for it.
  function loadToComposer(tpl) {
    const DRAFT_KEY = 'blastwa.draft.sending';
    let d = {};
    try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}') || {}; } catch (e) { d = {}; }
    d['msg-body'] = tpl.body || '';
    if (tpl.attachment_path) d.attachmentPath = tpl.attachment_path;
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch (e) {}
    location.hash = '#/sending';
  }

  // shared esc() from window.blastwa (hoisted in main.js); var, not const,
  // because scripts re-execute per navigation and top-level const would
  // throw 'already declared' on the second visit
  var esc = window.blastwa.esc;

  async function refresh() {
    const { invoke } = window.blastwa;
    const q = document.getElementById('tpl-search').value;
    const res = q ? await invoke('search_templates', { query: q }) : await invoke('list_templates');
    const tpls = Array.isArray(res) ? res : [];

    const $ = (id) => document.getElementById(id);
    $('tpl-count').textContent = tpls.length;
    $('tpl-empty').style.display = tpls.length ? 'none' : '';

    // keep the row objects addressable so the action buttons can hand a real
    // template to js instead of smuggling it through an html attribute
    window.__tplById = {};
    for (const t of tpls) window.__tplById[t.id] = t;

    $('tpl-body-rows').innerHTML = tpls.map((t) => `
      <tr>
        <td><b>${esc(t.name)}</b></td>
        <td>${(t.tags || []).map((tag) => `<span class="tag">${esc(tag)}</span>`).join('')}</td>
        <td style="white-space:normal;max-width:420px">${esc(String(t.body || '').slice(0, 100))}${String(t.body).length > 100 ? '...' : ''}</td>
        <td>
          <button class="btn btn-sm btn-secondary" data-act="load" data-id="${esc(t.id)}">Load to Composer</button>
          <button class="btn btn-sm" data-act="edit" data-id="${esc(t.id)}">Edit</button>
          <button class="btn btn-sm btn-danger" data-act="del" data-id="${esc(t.id)}">Delete</button>
        </td>
      </tr>`).join('');

    $('tpl-body-rows').querySelectorAll('button[data-act]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const tpl = window.__tplById[btn.dataset.id];
        if (!tpl) return;
        if (btn.dataset.act === 'load') loadToComposer(tpl);
        else if (btn.dataset.act === 'edit') openEditTpl(tpl);
        else if (btn.dataset.act === 'del') {
          if (!(await confirm(`Delete template "${tpl.name}"?`))) return;
          try {
            await invoke('delete_template', { id: tpl.id });
            await refresh();
          } catch (e) {
            alert('Delete failed: ' + (e && e.message ? e.message : e));
          }
        }
      });
    });
  }

  function openNewTpl() {
    editingId = null;
    document.getElementById('tpl-editor-title').textContent = 'New Template';
    document.getElementById('tpl-name').value = '';
    document.getElementById('tpl-tags').value = '';
    document.getElementById('tpl-body').value = '';
    document.getElementById('tpl-editor').style.display = '';
  }

  function openEditTpl(tpl) {
    editingId = tpl.id;
    document.getElementById('tpl-editor-title').textContent = 'Edit Template';
    document.getElementById('tpl-name').value = tpl.name || '';
    document.getElementById('tpl-tags').value = (tpl.tags || []).join(', ');
    document.getElementById('tpl-body').value = tpl.body || '';
    document.getElementById('tpl-editor').style.display = '';
  }

  function closeEditor() {
    document.getElementById('tpl-editor').style.display = 'none';
  }

  async function saveTpl() {
    const { invoke } = window.blastwa;
    const name = document.getElementById('tpl-name').value.trim();
    if (!name) {
      alert('Template name is required.');
      return;
    }
    const payload = {
      id: editingId,
      name,
      tags: document.getElementById('tpl-tags').value.split(',').map(s => s.trim()).filter(Boolean),
      body: document.getElementById('tpl-body').value,
    };
    try {
      await invoke('save_template', payload);
    } catch (e) {
      alert('Save failed: ' + (e && e.message ? e.message : e));
      return;
    }
    editingId = null;
    closeEditor();
    await refresh();
  }
</script>
