<div class="page-header">
  <div>
    <h1 class="page-title">Message Log</h1>
    <p class="page-subtitle">Campaign send history</p>
  </div>
  <div class="row">
    <select id="log-filter" style="width:160px">
      <option value="">All statuses</option>
      <option value="sent">Sent only</option>
      <option value="failed">Failed only</option>
      <option value="pending">Pending only</option>
    </select>
    <button class="btn btn-secondary" onclick="exportLog('csv')">Export CSV</button>
    <button class="btn btn-secondary" onclick="exportLog('xlsx')">Export Excel</button>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <span>Past Campaigns</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Account</th><th>Message</th>
            <th style="width:60px">Total</th><th style="width:60px">Sent</th>
            <th style="width:70px">Failed</th><th style="width:100px">Status</th>
          </tr>
        </thead>
        <tbody id="hist-body"></tbody>
      </table>
      <div class="empty-state" id="hist-empty">No past campaigns yet.</div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <span>Send History</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Timestamp</th><th>Number</th><th>Full Name</th>
            <th style="width:90px">Status</th><th>Error Reason</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
      <div class="empty-state" id="log-empty">No log entries yet.</div>
    </div>
    <div class="counts-bar">
      <span>Entries: <b id="log-count">0</b></span>
    </div>
  </div>
</div>

<script>
  window.init_log = async function () {
    const { invoke, listen } = window.blastwa;
    document.getElementById('log-filter').addEventListener('change', refresh);
    await refresh();
    await loadHistory();

    await listen('campaign_progress', async () => {
      await refresh();
      await loadHistory();
    });

    await listen('message_log', (ev) => {
      const p = ev.payload || ev;
      appendRow(p);
    });
  };

  // shared esc() from window.blastwa (hoisted in main.js); var, not const,
  // because scripts re-execute per navigation and top-level const would
  // throw 'already declared' on the second visit
  var esc = window.blastwa.esc;

  async function refresh() {
    const { invoke } = window.blastwa;
    const status = document.getElementById('log-filter').value;
    const res = await invoke('get_logs', { status });
    const entries = Array.isArray(res) ? res : [];

    document.getElementById('log-count').textContent = entries.length;
    document.getElementById('log-empty').style.display = entries.length ? 'none' : '';
    document.getElementById('log-body').innerHTML = entries.map(rowHtml).join('');
  }

  function rowHtml(e) {
    const cls = e.status === 'sent' ? 'badge-green'
      : e.status === 'failed' ? 'badge-red' : 'badge-yellow';
    const ts = e.timestamp ? new Date(e.timestamp).toLocaleString() : (e.time || '');
    return `<tr>
      <td>${esc(ts)}</td>
      <td class="mono">${esc(e.number)}</td>
      <td>${esc(e.fullname)}</td>
      <td><span class="badge ${cls}">${esc(e.status)}</span></td>
      <td>${esc(e.error_reason || '')}</td>
    </tr>`;
  }

  async function loadHistory() {
    const { invoke } = window.blastwa;
    let recs = [];
    try {
      recs = await invoke('list_sent_campaigns');
      if (!Array.isArray(recs)) recs = [];
    } catch (e) {
      recs = [];
    }
    document.getElementById('hist-empty').style.display = recs.length ? 'none' : '';
    document.getElementById('hist-body').innerHTML = recs.map(historyRowHtml).join('');
  }

  function historyRowHtml(r) {
    const cls = r.status === 'completed' ? 'badge-green'
      : r.status === 'stopped' ? 'badge-yellow' : 'badge-red';
    const date = r.started_at ? new Date(r.started_at).toLocaleString() : '';
    return `<tr>
      <td>${esc(date)}</td>
      <td class="mono">${esc(r.account)}</td>
      <td>${esc((r.message_preview || '').slice(0, 60))}</td>
      <td>${r.total ?? 0}</td>
      <td>${r.sent ?? 0}</td>
      <td>${r.failed ?? 0}</td>
      <td><span class="badge ${cls}">${esc(r.status)}</span></td>
    </tr>`;
  }

  function appendRow(e) {
    document.getElementById('log-empty').style.display = 'none';
    document.getElementById('log-body').insertAdjacentHTML('afterbegin', rowHtml(e));
  }

  async function exportLog(format) {
    const { invoke } = window.blastwa;
    const tauriDialog = window.__TAURI__ && window.__TAURI__.dialog;
    if (!tauriDialog || !tauriDialog.save) {
      alert('[mock] would export the log as ' + format + ' (browser dev mode)');
      return;
    }
    try {
      const path = await tauriDialog.save({
        title: 'Export log',
        defaultPath: window.blastwa.stampName('blastwa-log', format),
        filters: [format === 'xlsx'
          ? { name: 'Excel', extensions: ['xlsx'] }
          : { name: 'CSV', extensions: ['csv'] }],
      });
      if (!path) return;
      const r = await invoke('export_log', { format, path });
      alert('Exported ' + ((r && r.entries) ?? 0) + ' entries to ' + path);
    } catch (e) {
      alert('Export failed: ' + (e && e.message ? e.message : e));
    }
  }
</script>
