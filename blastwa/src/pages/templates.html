<div class="page-header">
  <div>
    <h1 class="page-title">Templates</h1>
    <p class="page-subtitle">Reusable message templates with tags</p>
  </div>
  <div class="row">
    <input type="text" id="tpl-search" placeholder="Search name or tag..." style="width:240px" />
    <button class="btn" onclick="openNewTpl()">+ New Template</button>
  </div>
</div>

<div class="panel" id="tpl-editor" style="display:none">
  <div class="panel-header">
    <span id="tpl-editor-title">New Template</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body">
    <div class="field"><label>Name</label><input type="text" id="tpl-name" /></div>
    <div class="field"><label>Tags (comma separated)</label><input type="text" id="tpl-tags" placeholder="promo,sales" /></div>
    <div class="field"><label>Body (supports spintax &amp; variables</label><textarea id="tpl-body"></textarea></div>
    <div class="row" style="margin-bottom:0">
      <button class="btn" onclick="saveTpl()">Save</button>
      <button class="btn btn-secondary" onclick="closeEditor()">Cancel</button>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <span>Template List</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Tags</th><th>Body Preview</th><th style="width:230px">Actions</th>
          </tr>
        </thead>
        <tbody id="tpl-body-rows"></tbody>
      </table>
      <div class="empty-state" id="tpl-empty">No templates found.</div>
    </div>
    <div class="counts-bar">
      <span>Total: <b id="tpl-count">0</b></span>
    </div>
  </div>
</div>

<script>
  let editingId = null;

  window.init_templates = async function () {
    const { invoke } = window.blastwa;
    document.getElementById('tpl-search').addEventListener('input', refresh);
    await refresh();
  };

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  async function refresh() {
    const { invoke } = window.blastwa;
    const q = document.getElementById('tpl-search').value;
    const res = q ? await invoke('search_templates', { query: q }) : await invoke('list_templates');
    const tpls = Array.isArray(res) ? res : [];

    const $ = (id) => document.getElementById(id);
    $('tpl-count').textContent = tpls.length;
    $('tpl-empty').style.display = tpls.length ? 'none' : '';

    $('tpl-body-rows').innerHTML = tpls.map((t) => `
      <tr>
        <td><b>${esc(t.name)}</b></td>
        <td>${(t.tags || []).map((tag) => `<span class="tag">${esc(tag)}</span>`).join('')}</td>
        <td style="white-space:normal;max-width:420px">${esc(String(t.body || '').slice(0, 100))}${String(t.body).length > 100 ? '...' : ''}</td>
        <td>
          <button class="btn btn-sm btn-secondary"
            onclick='window.blastwa.invoke("load_to_composer", ${JSON.stringify(JSON.stringify(t))}).then(()=>location.hash="#/sending")'>
            Load to Composer
          </button>
          <button class="btn btn-sm btn-danger"
            onclick="window.blastwa.invoke('delete_template', { id: '${t.id}' }).then(refresh)">
            Delete
          </button>
        </td>
      </tr>`).join('');
  }

  function openNewTpl() {
    editingId = null;
    document.getElementById('tpl-editor-title').textContent = 'New Template';
    document.getElementById('tpl-name').value = '';
    document.getElementById('tpl-tags').value = '';
    document.getElementById('tpl-body').value = '';
    document.getElementById('tpl-editor').style.display = '';
  }

  function closeEditor() {
    document.getElementById('tpl-editor').style.display = 'none';
  }

  async function saveTpl() {
    const { invoke } = window.blastwa;
    const payload = {
      id: editingId,
      name: document.getElementById('tpl-name').value,
      tags: document.getElementById('tpl-tags').value.split(',').map(s => s.trim()).filter(Boolean),
      body: document.getElementById('tpl-body').value,
    };
    await invoke('save_template', payload);
    closeEditor();
    refresh();
  }
</script>
