<div class="page-header">
  <div>
    <h1 class="page-title">Sending</h1>
    <p class="page-subtitle">Compose and launch a blast campaign</p>
  </div>
</div>

<div class="grid grid-forms">
  <div class="panel">
    <div class="panel-header">
      <span>Message</span>
      <span class="panel-menu">&#9776;</span>
    </div>
    <div class="panel-body">
      <div class="field">
        <label>Message body (supports spintax {a|b}, [[firstname]] variables; separate variants with a --- line for rotation)</label>
        <div class="fmt-toolbar" id="fmt-toolbar">
          <button type="button" class="fmt-btn fmt-bold" data-wrap="*" title="Bold">B</button>
          <button type="button" class="fmt-btn fmt-italic" data-wrap="_" title="Italic">I</button>
          <button type="button" class="fmt-btn fmt-strike" data-wrap="~" title="Strikethrough">S</button>
          <button type="button" class="fmt-btn fmt-mono" data-wrap="```" title="Monospace">&lt;/&gt;</button>
          <span class="fmt-sep"></span>
          <button type="button" class="fmt-btn" id="btn-emoji" title="Emoji">&#128512;</button>
        </div>
        <div class="emoji-grid hidden" id="emoji-grid"></div>
        <textarea id="msg-body" placeholder="Hai [[firstname]]! Dapat promo {spesial|keren} nih..."></textarea>
        <div id="preview-out" class="preview-out" style="display:none"></div>
      </div>
      <div class="field">
        <label>Attachment (image / pdf / video / audio)</label>
        <input type="file" id="attachment" />
        <span id="attachment-name" class="mono" style="font-size:12px;color:#0e7c7b"></span>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Caption (for attachments)</label>
        <input type="text" id="caption" placeholder="optional caption" />
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>Campaign Settings</span>
      <span class="panel-menu">&#9776;</span>
    </div>
    <div class="panel-body">
      <p class="panel-note">Per-campaign settings: applied to this send only.</p>
      <div class="field">
        <label>Account</label>
        <select id="account-select"><option value="">Default</option></select>
      </div>
      <div class="row">
        <div class="field" style="flex:1">
          <label>Delay min (sec)</label>
          <input type="number" id="delay-min" value="3" min="1" />
        </div>
        <div class="field" style="flex:1">
          <label>Delay max (sec)</label>
          <input type="number" id="delay-max" value="9" min="2" />
        </div>
      </div>
      <div class="field">
        <label>Human Mode preset</label>
        <select id="human-preset">
          <option value="off">Off (flat delay, like original app)</option>
          <option value="natural" selected>Natural (recommended)</option>
          <option value="cautious">Cautious (slow &amp; safe)</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="field checkbox-label">
        <input type="checkbox" id="safe-mode" />
        <label for="safe-mode">Safe mode (verify chat exists before send)</label>
      </div>
      <div class="field checkbox-label" style="margin-bottom:0;margin-top:8px">
        <input type="checkbox" id="blind-mode" />
        <label for="blind-mode">Blind mode (skip all verification for speed; overrides safe mode)</label>
      </div>
      <div class="field" style="margin-bottom:0;margin-top:8px">
        <label>Schedule (optional: leave empty to send now)</label>
        <input type="datetime-local" id="schedule-at" />
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <span>Campaign Progress</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body">
    <div class="flex-between">
      <span id="contact-count"><b>0</b> contacts loaded</span>
      <div class="row">
        <button class="btn btn-secondary" id="btn-preview-spintax">Preview Spintax</button>
        <button class="btn" id="btn-start">Send Now</button>
        <button class="btn btn-secondary" id="btn-pause">Pause</button>
        <button class="btn btn-danger" id="btn-stop">Stop</button>
      </div>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="counters">
      <span>Sent: <b id="c-sent" class="status-sent">0</b></span>
      <span>Failed: <b id="c-failed" class="status-failed">0</b></span>
      <span>Pending: <b id="c-pending" class="status-pending">0</b></span>
      <span id="paused-badge" class="badge badge-yellow" style="display:none">PAUSED</span>
      <span id="current-status"></span>
    </div>
  </div>
</div>

<script>
  window.init_sending = async function () {
    const { invoke, listen, addCleanup } = window.blastwa;
    const $ = (id) => document.getElementById(id);

    // draft persistence: route() rebuilds this page on every navigation, so
    // the compose state lives in localStorage and is restored on init
    const DRAFT_KEY = 'blastwa.draft.sending';
    const draftFields = ['msg-body', 'caption', 'account-select', 'delay-min',
      'delay-max', 'human-preset', 'safe-mode', 'schedule-at', 'blind-mode'];
    let attachmentPath = null;

    function saveDraft() {
      const d = { attachmentPath };
      for (const id of draftFields) {
        d[id] = $(id).type === 'checkbox' ? $(id).checked : $(id).value;
      }
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch (e) {}
    }

    function restoreDraft() {
      let d;
      try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return; }
      if (!d) return;
      for (const id of draftFields) {
        if (d[id] === undefined) continue;
        if ($(id).type === 'checkbox') $(id).checked = d[id];
        else if ($(id).tagName === 'SELECT' && !$(id).querySelector(`option[value="${d[id]}"]`)) continue;
        else $(id).value = d[id];
      }
      attachmentPath = d.attachmentPath || null;
      if (attachmentPath) {
        $('attachment-name').textContent = attachmentPath.split(/[\/]/).pop();
      }
    }

    for (const id of draftFields) {
      $(id).addEventListener('input', saveDraft);
      $(id).addEventListener('change', saveDraft);
    }

    // formatting toolbar (U4): wraps the current selection in whatsapp
    // formatting tokens, or inserts around an empty cursor. mousedown is
    // prevented so the textarea never loses focus or its live selection.
    const msgBody = $('msg-body');

    function insertAroundToken(token) {
      const start = msgBody.selectionStart ?? msgBody.value.length;
      const end = msgBody.selectionEnd ?? start;
      const sel = msgBody.value.slice(start, end);
      msgBody.value =
        msgBody.value.slice(0, start) + token + sel + token + msgBody.value.slice(end);
      // cursor lands right after the wrapped content
      const caret = start + token.length + sel.length + token.length;
      msgBody.focus();
      msgBody.setSelectionRange(caret, caret);
      saveDraft();
    }

    for (const btn of document.querySelectorAll('#fmt-toolbar .fmt-btn[data-wrap]')) {
      btn.addEventListener('mousedown', (e) => e.preventDefault());
      btn.addEventListener('click', () => insertAroundToken(btn.dataset.wrap));
    }

    // emoji picker: fixed palette (no network), inserts at cursor position
    const EMOJIS = ['😀','😂','🥹','😍','😎','🤔','😴','😭','😡','👍','🙏','👏','💪','🔥','✨','❤️','💚','🎉','🎁','💰','📢','✅','⚠️','📞'];
    const emojiGrid = $('emoji-grid');
    emojiGrid.innerHTML = EMOJIS.map((em) =>
      `<button type="button" class="emoji-pick" data-emoji="${em}">${em}</button>`
    ).join('');

    $('btn-emoji').addEventListener('mousedown', (e) => e.preventDefault());
    $('btn-emoji').addEventListener('click', () => {
      emojiGrid.classList.toggle('hidden');
      $('btn-emoji').classList.toggle('active', !emojiGrid.classList.contains('hidden'));
    });

    emojiGrid.addEventListener('mousedown', (e) => e.preventDefault());
    emojiGrid.addEventListener('click', (ev) => {
      const pick = ev.target.closest('.emoji-pick');
      if (!pick) return;
      const em = pick.dataset.emoji;
      const pos = msgBody.selectionStart ?? msgBody.value.length;
      const end = msgBody.selectionEnd ?? pos;
      msgBody.value =
        msgBody.value.slice(0, pos) + em + msgBody.value.slice(end);
      const caret = pos + em.length;
      msgBody.focus();
      msgBody.setSelectionRange(caret, caret);
      saveDraft();
    });

    // tauri v2 hides the real path from <input type=file>, so intercept the
    // picker and use the dialog plugin (browser dev keeps the native input)
    $('attachment').addEventListener('click', (e) => {
      const tauriDialog = window.__TAURI__ && window.__TAURI__.dialog;
      if (!tauriDialog) return;
      e.preventDefault();
      tauriDialog.open({
        multiple: false,
        title: 'Choose attachment',
        filters: [{ name: 'Media', extensions: ['png', 'jpg', 'jpeg', 'webp', 'gif',
          'pdf', 'mp4', 'mkv', 'webm', 'avi', 'mp3', 'wav', 'ogg', 'opus', 'weba'] }],
      }).then((path) => {
        if (!path) return;
        attachmentPath = path;
        $('attachment-name').textContent = path.split(/[\/]/).pop();
        saveDraft();
      }).catch(() => {});
    });

    const contacts = await invoke('get_contacts');
    const count = Array.isArray(contacts) ? contacts.length : (contacts.count ?? 0);
    $('contact-count').innerHTML = `<b>${count}</b> contacts loaded`;

    const accounts = await invoke('list_accounts');
    const list = Array.isArray(accounts) ? accounts : [];
    if (list.length) {
      $('account-select').innerHTML = list
        .map((a) => `<option value="${a.name}">${a.name}</option>`)
        .join('');
    }

    restoreDraft();

    // progress restore: counters live in the backend, so a tab switch never
    // loses them; last "current number" comes from the session cache
    function setPausedUi(isPaused) {
      $('paused-badge').style.display = isPaused ? '' : 'none';
      $('btn-pause').textContent = isPaused ? 'Resume' : 'Pause';
    }

    function renderCounters(sent, failed, pending) {
      $('c-sent').textContent = sent;
      $('c-failed').textContent = failed;
      $('c-pending').textContent = pending;
      const total = sent + failed + pending;
      $('progress-fill').style.width = (total ? ((sent + failed) / total) * 100 : 0).toFixed(1) + '%';
    }

    try {
      const st = await invoke('get_status');
      if (st && !st.mock && (st.running || (st.total || 0) > 0)) {
        const sent = st.sent || 0, failed = st.failed || 0;
        const total = st.total || 0;
        renderCounters(sent, failed, Math.max(total - sent - failed, 0));
        setPausedUi(!!st.paused);
        const last = sessionStorage.getItem('blastwa.campaign.last');
        if (last) $('current-status').textContent = last;
      }
    } catch (e) {}

    $('btn-pause').onclick = async () => {
      try {
        const st = await invoke('get_status');
        if (st && st.paused) {
          await invoke('resume_campaign');
          setPausedUi(false);
        } else {
          await invoke('pause_campaign');
          setPausedUi(true);
          $('current-status').textContent = 'paused - press Resume to continue';
        }
      } catch (e) {
        alert('Pause/Resume failed: ' + (e && e.message ? e.message : e));
      }
    };

    $('btn-start').onclick = async () => {
      try {
        const scheduleRaw = $('schedule-at').value;
        const r = await invoke('start_campaign', {
          message: $('msg-body').value,
          account: $('account-select').value,
          delayMinS: Number($('delay-min').value),
          delayMaxS: Number($('delay-max').value),
          humanPreset: $('human-preset').value,
          attachmentPath: attachmentPath,
          caption: $('caption').value || null,
          isSafeMode: $('safe-mode').checked,
          isBlindMode: $('blind-mode').checked,
          scheduleAt: scheduleRaw || null,
        });
        const nVariants = r && r.variants ? r.variants : 1;
        $('current-status').textContent =
          nVariants > 1 ? `${nVariants} message variants rotating across contacts` : '';
        if (r && r.scheduled_at) {
          startCountdown(r.scheduled_at);
        }
      } catch (e) {
        alert('Start failed: ' + (e && e.message ? e.message : e));
      }
    };

    // live countdown while a scheduled campaign waits for its fire time
    let countdownTimer = null;
    function startCountdown(localIso) {
      const target = new Date(localIso).getTime();
      if (Number.isNaN(target)) return;
      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        const secs = Math.round((target - Date.now()) / 1000);
        if (secs <= 0) {
          clearInterval(countdownTimer);
          countdownTimer = null;
          $('current-status').textContent = 'scheduled campaign firing now...';
          return;
        }
        const h = String(Math.floor(secs / 3600)).padStart(2, '0');
        const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
        const s = String(secs % 60).padStart(2, '0');
        $('current-status').textContent = `scheduled: firing in ${h}:${m}:${s} (Stop cancels)`;
      }, 1000);
    }
    addCleanup(() => { if (countdownTimer) clearInterval(countdownTimer); });

    $('btn-stop').onclick = () => invoke('stop_campaign');

    function renderWaFormat(text) {
      const esc = String(text).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[c]);
      return esc
        .replace(/\*(?!\s)([^*\n]+?)(?!\s)\*/g, '<b>$1</b>')
        .replace(/_(?!\s)([^_\n]+?)(?!\s)_/g, '<i>$1</i>')
        .replace(/~(?!\s)([^~\n]+?)(?!\s)~/g, '<s>$1</s>')
        .replace(/```([^`]+?)```/g, '<code>$1</code>');
    }

    $('btn-preview-spintax').onclick = async () => {
      const out = $('preview-out');
      try {
        const r = await invoke('preview_spintax', { text: $('msg-body').value });
        const previews = Array.isArray(r) ? r : (r.previews || []);
        if (!previews.length) {
          out.style.display = '';
          out.innerHTML = '<div class="preview-line">No contacts loaded - add contacts to see variable examples.</div>';
          return;
        }
        out.style.display = '';
        out.innerHTML = previews
          .map((p, i) => `<div class="preview-line"><span class="preview-tag">contact ${i + 1}</span>${renderWaFormat(p)}</div>`)
          .join('');
      } catch (e) {
        out.style.display = '';
        out.innerHTML = `<div class="preview-line">Preview failed: ${esc(e && e.message ? e.message : e)}</div>`;
      }
    };

    await listen('campaign_progress', (ev) => {
      const p = ev.payload || ev;
      renderCounters(p.sent ?? 0, p.failed ?? 0, p.pending ?? 0);
      const line = p.current_number ? `last: ${p.current_number} (${p.status})` : '';
      $('current-status').textContent = line;
      try { sessionStorage.setItem('blastwa.campaign.last', line); } catch (e) {}
    });
  };
</script>
