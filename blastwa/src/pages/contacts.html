<div class="page-header">
  <div>
    <h1 class="page-title">Contacts</h1>
    <p class="page-subtitle">Import and manage your blast contact list</p>
  </div>
  <label class="checkbox-label">
    <input type="checkbox" id="remove-dupes" checked />
    Remove duplicates
  </label>
</div>

<div class="panel">
  <div class="panel-header">
    <span>Import</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body">
    <div class="flex-between">
      <div class="row">
        <button class="btn" onclick="pickAndImport()">Import .txt / .csv / .xlsx</button>
        <input type="file" id="import-file" accept=".txt,.csv,.xlsx,.xls"
          style="display:none" onchange="handleImport(this)" />
        <button class="btn btn-danger" onclick="clearAll()">Clear List</button>
      </div>
      <span style="font-size:11px;color:var(--text-dim)">
        .txt format: <span class="mono">number|fullname|var1|var2|var3|var4|var5</span> (one per line, extra columns optional)
      </span>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <span>Contact List</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:30px">#</th>
            <th>Number</th><th>Full Name</th>
            <th>Var1</th><th>Var2</th><th>Var3</th><th>Var4</th><th>Var5</th>
          </tr>
        </thead>
        <tbody id="contacts-body"></tbody>
      </table>
      <div class="empty-state" id="contacts-empty">No contacts loaded. Import a file to get started.</div>
    </div>
    <div class="counts-bar">
      <span>Total: <b id="total-count">0</b></span>
    </div>
  </div>
</div>

<script>
  window.init_contacts = async function () {
    const { invoke } = window.blastwa;
    await refresh();
  };

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  async function refresh() {
    const { invoke } = window.blastwa;
    const res = await invoke('get_contacts');
    const list = Array.isArray(res) ? res : (res.contacts || []);

    document.getElementById('total-count').textContent = list.length;
    document.getElementById('contacts-empty').style.display = list.length ? 'none' : '';
    document.getElementById('contacts-body').innerHTML = list.map((c, i) => `
      <tr>
        <td>${i + 1}</td>
        <td class="mono">${esc(c.number)}</td>
        <td>${esc(c.fullname)}</td>
        <td>${esc(c.var1)}</td><td>${esc(c.var2)}</td><td>${esc(c.var3)}</td>
        <td>${esc(c.var4)}</td><td>${esc(c.var5)}</td>
      </tr>`).join('');
  }

  async function importFromPath(path, removeDupes) {
    const { invoke } = window.blastwa;
    try {
      const res = await invoke('import_contacts', { path, removeDupes });
      if (res && res.mock) {
        alert(`[mock] would import ${path}`);
      } else if (res && res.imported === 0) {
        alert('File read, but 0 valid contacts found. Check the format: number|name|var1|... one per line (or CSV with a number column).');
      }
      await refresh();
    } catch (e) {
      // never fail silently again
      alert('Import failed: ' + (e && e.message ? e.message : e));
    }
  }

  async function pickAndImport() {
    const removeDupes = document.getElementById('remove-dupes').checked;
    const tauriDialog = window.__TAURI__ && window.__TAURI__.dialog;
    if (tauriDialog) {
      // tauri v2: the web <input type=file> hides the real path, so ask the
      // dialog plugin for it instead
      const path = await tauriDialog.open({
        multiple: false,
        title: 'Import contacts',
        filters: [{ name: 'Contacts', extensions: ['txt', 'csv', 'xlsx', 'xls'] }],
      });
      if (!path) return;
      await importFromPath(path, removeDupes);
    } else {
      // plain browser dev: labeled mock path via the hidden input
      document.getElementById('import-file').click();
    }
  }

  async function handleImport(input) {
    const file = input.files[0];
    if (!file) return;
    await importFromPath(file.name, document.getElementById('remove-dupes').checked);
    input.value = '';
  }

  async function clearAll() {
    if (!confirm('Clear entire contact list?')) return;
    await window.blastwa.invoke('clear_contacts');
    refresh();
  }
</script>
