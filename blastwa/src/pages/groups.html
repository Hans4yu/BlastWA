<div class="page-header">
  <div>
    <h1 class="page-title">Groups</h1>
    <p class="page-subtitle">Grab WhatsApp group participants into your contact list</p>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <span>WhatsApp Groups</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Group Name</th><th>Group ID</th><th style="width:200px">Actions</th></tr>
        </thead>
        <tbody id="groups-body"></tbody>
      </table>
      <div class="empty-state" id="groups-empty">Loading groups... make sure an account is connected.</div>
    </div>
    <div class="counts-bar">
      <span>Total: <b id="groups-total">0</b></span>
      <button class="btn btn-sm" id="btn-export-groups">Export CSV</button>
      <button class="btn btn-sm" id="btn-export-xlsx">Export Excel (per group)</button>
      <button class="btn btn-sm" id="btn-refresh-groups">Refresh</button>
    </div>
  </div>
</div>

<script>
  window.init_groups = async function () {
    const { invoke } = window.blastwa;
    const $ = (id) => document.getElementById(id);

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[c]);
    }

    function showEmpty(msg) {
      $('groups-empty').textContent = msg;
      $('groups-empty').style.display = '';
    }

    async function grab(groupId, btn) {
      btn.disabled = true;
      btn.textContent = 'Grabbing...';
      try {
        const r = await invoke('grab_participants', {
          account: window.__groupsAccount,
          groupId,
        });
        const n = (r && (r.count ?? r.grabbed)) ?? 0;
        alert('Grabbed ' + n + ' participants into the contact list');
      } catch (e) {
        alert('Grab failed: ' + (e && e.message ? e.message : e));
      }
      btn.disabled = false;
      btn.textContent = 'Grab Participants';
    }

    const CACHE_KEY = 'blastwa.groups.cache';

    function saveCache(account, groups) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ account, groups })); } catch (e) {}
    }
    function loadCache() {
      try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { return null; }
    }

    function renderGroups(groups) {
      $('groups-total').textContent = groups.length;
      if (!groups.length) {
        showEmpty('No groups found for ' + (window.__groupsAccount || 'this account') + '.');
        return;
      }
      $('groups-empty').style.display = 'none';
      $('groups-body').innerHTML = groups.map((g) => `
        <tr>
          <td><b>${esc(g.name)}</b></td>
          <td class="mono">${esc(g.id)}</td>
          <td>
            <button class="btn btn-sm" data-gid="${esc(g.id)}">Grab Participants</button>
          </td>
        </tr>`).join('');
      $('groups-body').querySelectorAll('button[data-gid]').forEach((btn) => {
        btn.addEventListener('click', () => grab(btn.dataset.gid, btn));
      });
    }

    async function fetchAndRender() {
      showEmpty('Loading groups...');
      const accounts = await invoke('list_accounts');
      const list = Array.isArray(accounts) ? accounts : [];
      const account = (list.find((a) => a.connected) || list.find((a) => a.browser_running) || {}).name;
      if (!account) {
        showEmpty('No running account. Open a browser from the Dashboard and scan the QR first.');
        return;
      }
      window.__groupsAccount = account;

      let res;
      try {
        res = await invoke('list_groups', { account });
      } catch (e) {
        showEmpty('Failed to load groups: ' + (e && e.message ? e.message : e));
        return;
      }
      const groups = Array.isArray(res) ? res : [];
      saveCache(account, groups);
      renderGroups(groups);
    }

    async function refresh() {
      // restore instantly from cache; only hit whatsapp when empty or explicit
      const cached = loadCache();
      if (cached && Array.isArray(cached.groups) && cached.groups.length) {
        window.__groupsAccount = cached.account;
        renderGroups(cached.groups);
        return;
      }
      await fetchAndRender();
    }

    $('btn-export-groups').addEventListener('click', async () => {
      const rows = Array.from($('groups-body').querySelectorAll('tr')).map((tr) => ({
        name: tr.querySelector('td b') ? tr.querySelector('td b').textContent : '',
        id: tr.querySelectorAll('td')[1] ? tr.querySelectorAll('td')[1].textContent : '',
      }));
      if (!rows.length) {
        alert('No groups to export. Fetch the list first.');
        return;
      }
      const tauriDialog = window.__TAURI__ && window.__TAURI__.dialog;
      if (!tauriDialog || !tauriDialog.save) {
        alert('[mock] would export ' + rows.length + ' groups (browser dev mode)');
        return;
      }
      try {
        const path = await tauriDialog.save({
          title: 'Export groups',
          defaultPath: 'blastwa-groups.csv',
          filters: [{ name: 'CSV', extensions: ['csv'] }],
        });
        if (!path) return;
        const r = await invoke('export_groups', { path, groups: rows });
        alert('Exported ' + ((r && r.exported) ?? 0) + ' groups to ' + path);
      } catch (e) {
        alert('Export failed: ' + (e && e.message ? e.message : e));
      }
    });

    $('btn-refresh-groups').addEventListener('click', () => {
      fetchAndRender().catch((e) => showEmpty('Refresh failed: ' + (e && e.message ? e.message : e)));
    });

    function currentGroups() {
      return Array.from($('groups-body').querySelectorAll('tr')).map((tr) => ({
        name: tr.querySelector('td b') ? tr.querySelector('td b').textContent : '',
        id: tr.querySelectorAll('td')[1] ? tr.querySelectorAll('td')[1].textContent : '',
      })).filter((g) => g.id);
    }

    $('btn-export-xlsx').addEventListener('click', async () => {
      const groups = currentGroups();
      if (!groups.length) {
        alert('No groups to export. Fetch the list first.');
        return;
      }
      const tauriDialog = window.__TAURI__ && window.__TAURI__.dialog;
      if (!tauriDialog || !tauriDialog.save) {
        alert('[mock] would export ' + groups.length + ' group sheets (browser dev mode)');
        return;
      }
      try {
        const path = await tauriDialog.save({
          title: 'Export groups to Excel',
          defaultPath: 'blastwa-groups.xlsx',
          filters: [{ name: 'Excel', extensions: ['xlsx'] }],
        });
        if (!path) return;
        const r = await invoke('export_groups_xlsx', {
          account: window.__groupsAccount, path, groups,
        });
        alert('Exported ' + ((r && r.groups) ?? 0) + ' sheets / ' + ((r && r.rows) ?? 0) +
          ' participants to ' + path);
      } catch (e) {
        alert('Export failed: ' + (e && e.message ? e.message : e));
      }
    });

    await refresh();
  };
</script>
