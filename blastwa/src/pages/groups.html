<div class="page-header">
  <div>
    <h1 class="page-title">Groups</h1>
    <p class="page-subtitle">Grab WhatsApp group participants into your contact list</p>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <span>WhatsApp Groups</span>
    <span class="panel-menu">&#9776;</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Group Name</th><th>Group ID</th><th style="width:200px">Actions</th></tr>
        </thead>
        <tbody id="groups-body"></tbody>
      </table>
      <div class="empty-state" id="groups-empty">Loading groups... make sure an account is connected.</div>
    </div>
    <div class="counts-bar">
      <span>Total: <b id="groups-total">0</b></span>
      <span id="groups-cache-note" style="display:none;color:var(--text-dim)"></span>
      <button class="btn btn-sm" id="btn-export-groups">Export CSV</button>
      <button class="btn btn-sm" id="btn-export-xlsx">Export Excel (per group)</button>
      <button class="btn btn-sm" id="btn-refresh-groups">Refresh</button>
    </div>
  </div>
</div>

<script>
  // shared esc() from window.blastwa (hoisted in main.js); var, not const,
  // because scripts re-execute per navigation and top-level const would
  // throw 'already declared' on the second visit
  var esc = window.blastwa.esc;

  window.init_groups = async function () {
    const { invoke } = window.blastwa;
    const $ = (id) => document.getElementById(id);

    function showEmpty(msg) {
      $('groups-empty').textContent = msg;
      $('groups-empty').style.display = '';
    }

    async function grab(groupId, btn) {
      btn.disabled = true;
      btn.textContent = 'Grabbing...';
      try {
        const r = await invoke('grab_participants', {
          account: window.__groupsAccount,
          groupId,
        });
        const n = (r && (r.count ?? r.grabbed)) ?? 0;
        alert('Grabbed ' + n + ' participants into the contact list');
      } catch (e) {
        alert('Grab failed: ' + (e && e.message ? e.message : e));
      }
      btn.disabled = false;
      btn.textContent = 'Grab Participants';
    }

    // groups cache: one localStorage entry, { account, fetchedAt, groups }.
    // restores instantly on tab switches so whatsapp is only hit on first
    // load, explicit Refresh, account change or a genuinely empty store.
    const CACHE_KEY = 'blastwa.groups.cache';

    function hasRows(c) {
      return !!c && Array.isArray(c.groups) && c.groups.length > 0;
    }

    // raw read without account binding; lets saveCache see whose rows are
    // currently stored before it decides to overwrite them
    function readRawCache() {
      try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); }
      catch (e) { return null; }
    }

    // single write chokepoint for the cache slot. writer-level invariant:
    // an empty whatsapp answer must NEVER overwrite an entry that holds
    // non-empty rows - only an explicit user Refresh may clear stored rows.
    // enforcing this at the write covers every fetch path that can reach
    // saveCache, including account switches on the single slot.
    // returns false when the write was refused.
    function saveCache(account, groups, opts = {}) {
      try {
        if ((!Array.isArray(groups) || !groups.length) && !opts.explicit && hasRows(readRawCache())) {
          return false;
        }
        localStorage.setItem(CACHE_KEY, JSON.stringify({ account, fetchedAt: Date.now(), groups }));
        return true;
      } catch (e) { return false; }
    }
    function loadCache(account) {
      const c = readRawCache();
      if (!c || !Array.isArray(c.groups)) return null;
      // one guard, two rejection reasons: a shapeless/legacy entry with no
      // account field is never trusted, and neither is another account's data
      if (!c.account || (account && c.account !== account)) return null;
      return c;
    }

    function cacheAgeLabel(fetchedAt) {
      if (!fetchedAt) return 'cached earlier';
      const s = Math.max(0, Math.round((Date.now() - fetchedAt) / 1000));
      if (s < 60) return 'cached just now';
      const m = Math.floor(s / 60);
      if (m < 60) return `cached ${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `cached ${h}h ago`;
      return `cached ${Math.floor(h / 24)}d ago`;
    }

    function showCacheNote(text) {
      const el = $('groups-cache-note');
      el.textContent = text || '';
      el.style.display = text ? '' : 'none';
    }

    async function resolveAccount() {
      const accounts = await invoke('list_accounts');
      const list = Array.isArray(accounts) ? accounts : [];
      return (list.find((a) => a.connected) || list.find((a) => a.browser_running) || {}).name;
    }

    function fmtErr(e) {
      return e && e.message ? e.message : String(e);
    }

    function renderGroups(groups) {
      $('groups-total').textContent = groups.length;
      if (!groups.length) {
        showEmpty('No groups found for ' + (window.__groupsAccount || 'this account') + '.');
        return;
      }
      $('groups-empty').style.display = 'none';
      $('groups-body').innerHTML = groups.map((g) => `
        <tr>
          <td><b>${esc(g.name)}</b></td>
          <td class="mono">${esc(g.id)}</td>
          <td>
            <button class="btn btn-sm" data-gid="${esc(g.id)}">Grab Participants</button>
          </td>
        </tr>`).join('');
      $('groups-body').querySelectorAll('button[data-gid]').forEach((btn) => {
        btn.addEventListener('click', () => grab(btn.dataset.gid, btn));
      });
    }

    async function fetchAndRender(account, stale, opts = {}) {
      showEmpty('Loading groups...');
      let res;
      try {
        res = await invoke('list_groups', { account });
      } catch (e) {
        // cdp hiccup: keep serving the last good list instead of blanking out
        if (hasRows(stale)) {
          renderGroups(stale.groups);
          showCacheNote(`refresh failed · showing ${cacheAgeLabel(stale.fetchedAt)} cache (${fmtErr(e)})`);
          return;
        }
        showEmpty('Failed to load groups: ' + fmtErr(e));
        return;
      }
      const groups = Array.isArray(res) ? res : [];
      // empty-answer protection lives inside saveCache (the single write
      // chokepoint), so every fetch path gets it without its own guard here.
      const wrote = saveCache(account, groups, opts);
      renderGroups(groups); // empty list renders the honest per-account empty state
      showCacheNote(!groups.length
        ? (wrote
          ? `whatsapp answered 0 groups · nothing cached`
          : `whatsapp answered 0 groups · kept previously cached rows`)
        : '');
    }

    async function refresh(opts = {}) {
      const account = await resolveAccount();
      if (!account) {
        showEmpty('No running account. Open a browser from the Dashboard and scan the QR first.');
        return;
      }
      window.__groupsAccount = account;

      const cached = loadCache(account);
      if (!opts.explicit && hasRows(cached)) {
        // instant restore on tab switches; whatsapp stays untouched
        renderGroups(cached.groups);
        showCacheNote(`${cacheAgeLabel(cached.fetchedAt)} · ${account}`);
        return;
      }
      await fetchAndRender(account, cached, opts);
    }

    $('btn-export-groups').addEventListener('click', async () => {
      const rows = Array.from($('groups-body').querySelectorAll('tr')).map((tr) => ({
        name: tr.querySelector('td b') ? tr.querySelector('td b').textContent : '',
        id: tr.querySelectorAll('td')[1] ? tr.querySelectorAll('td')[1].textContent : '',
      }));
      if (!rows.length) {
        alert('No groups to export. Fetch the list first.');
        return;
      }
      const tauriDialog = window.__TAURI__ && window.__TAURI__.dialog;
      if (!tauriDialog || !tauriDialog.save) {
        alert('[mock] would export ' + rows.length + ' groups (browser dev mode)');
        return;
      }
      try {
        const path = await tauriDialog.save({
          title: 'Export groups',
          defaultPath: window.blastwa.stampName('blastwa-groups', 'csv'),
          filters: [{ name: 'CSV', extensions: ['csv'] }],
        });
        if (!path) return;
        const r = await invoke('export_groups', { path, groups: rows });
        alert('Exported ' + ((r && r.exported) ?? 0) + ' groups to ' + path);
      } catch (e) {
        alert('Export failed: ' + (e && e.message ? e.message : e));
      }
    });

    $('btn-refresh-groups').addEventListener('click', () => {
      refresh({ explicit: true }).catch((e) => showEmpty('Refresh failed: ' + fmtErr(e)));
    });

    function currentGroups() {
      return Array.from($('groups-body').querySelectorAll('tr')).map((tr) => ({
        name: tr.querySelector('td b') ? tr.querySelector('td b').textContent : '',
        id: tr.querySelectorAll('td')[1] ? tr.querySelectorAll('td')[1].textContent : '',
      })).filter((g) => g.id);
    }

    $('btn-export-xlsx').addEventListener('click', async () => {
      const groups = currentGroups();
      if (!groups.length) {
        alert('No groups to export. Fetch the list first.');
        return;
      }
      const tauriDialog = window.__TAURI__ && window.__TAURI__.dialog;
      if (!tauriDialog || !tauriDialog.save) {
        alert('[mock] would export ' + groups.length + ' group sheets (browser dev mode)');
        return;
      }
      try {
        const path = await tauriDialog.save({
          title: 'Export groups to Excel',
          defaultPath: window.blastwa.stampName('blastwa-groups', 'xlsx'),
          filters: [{ name: 'Excel', extensions: ['xlsx'] }],
        });
        if (!path) return;
        const r = await invoke('export_groups_xlsx', {
          account: window.__groupsAccount, path, groups,
        });
        alert('Exported ' + ((r && r.groups) ?? 0) + ' sheets / ' + ((r && r.rows) ?? 0) +
          ' participants to ' + path);
      } catch (e) {
        alert('Export failed: ' + (e && e.message ? e.message : e));
      }
    });

    await refresh();
  };
</script>
